AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Trade journal v2 — SPA on CloudFront + S3, HTTP API (Cognito JWT) + Lambda, DynamoDB, S3 photos, Bedrock coach

# Deploy ONLY with the default AWS profile (scripts/deploy.sh enforces it). No account IDs in this file:
# pseudo-parameters only. Every nameable resource is prefixed `${AWS::StackName}-` because the CI deploy
# role and the permissions boundary (infra/cicd-role.yaml, stack `tradejournal-cicd`) scope by that prefix.
# Spec: docs/superpowers/specs/2026-10-13-v2-simple-journal-on-aws-design.md

Parameters:
  Stage:
    Type: String
    Default: prod
    AllowedValues: [dev, prod]
  CoachModelId:
    Type: String
    Default: deepseek.v3.2
    Description: >-
      Bedrock model for the AI coach (Converse). deepseek.v3.2 supports ON_DEMAND in us-east-1, so the bare
      foundation-model id works; an inference-profile id (us.…) also works with the IAM policy below.
  FmpKeyParam:
    Type: String
    Default: clearvest-fmp
    Description: >-
      SSM SecureString NAME (no leading slash) holding the FMP API key. Shared with ClearVest, so it shares
      that quota. If missing, economic events beyond Forex Factory's two weeks come back as "unavailable".
      Must match FmpKeyParam on the tradejournal-cicd stack (the permissions boundary scopes to it).
  AppUrl:
    Type: String
    Default: https://dc1cprzv21d8m.cloudfront.net
    AllowedPattern: ^https://\S+$
    Description: >-
      Public app URL for the Cognito invite email. A parameter, not the distribution's domain, because the user pool
      can't reference CloudFront (Distribution → HttpApi → JWT authorizer → UserPool would be a cycle).
      Keep it equal to the AppUrl stack output.

Globals:
  Function:
    Runtime: python3.13
    Architectures: [arm64]
    MemorySize: 512
    Timeout: 29
    # Created by infra/cicd-role.yaml (stack tradejournal-cicd), which must be deployed first.
    PermissionsBoundary: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/${AWS::StackName}-boundary
    Layers:
      # AWS-owned public Powertools layer (not our account). v36 = Powertools 3.31.1, which matches the
      # aws-lambda-powertools pin in pyproject.toml — bump both together.
      - !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:017000801446:layer:AWSLambdaPowertoolsPythonV3-python313-arm64:36
    Environment:
      Variables:
        STAGE: !Ref Stage
        POWERTOOLS_SERVICE_NAME: tradejournal
        POWERTOOLS_LOG_LEVEL: INFO

Resources:
  # ─── Data ──────────────────────────────────────────────────────────────
  JournalTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${AWS::StackName}-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
        - { AttributeName: tid, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      GlobalSecondaryIndexes:
        # Trade id → sort key (TRADE#<date>#<id>), so a date edit can find and move the old item.
        # Sparse: only trades carry `tid`.
        - IndexName: byId
          KeySchema:
            - { AttributeName: pk, KeyType: HASH }
            - { AttributeName: tid, KeyType: RANGE }
          Projection: { ProjectionType: KEYS_ONLY }
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      # Market cache items (pk=MARKET) carry `ttl`; reads also treat ttl <= now as a miss.
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  PhotoBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      # Auto-named (CloudFormation prefixes it with the stack name, which the boundary relies on).
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      CorsConfiguration:
        CorsRules:
          # Browser uploads via presigned PUT (fetch → needs CORS); views via presigned GET <img>.
          # Origin `*` on purpose: naming the CloudFront domain here would create a dependency cycle
          # (Distribution → SecurityHeadersPolicy/HttpApi → ApiFunction policy → PhotoBucket), and the
          # presigned signature — not the Origin header — is the access control.
          - AllowedMethods: [GET, PUT, HEAD]
            AllowedOrigins: ["*"]
            AllowedHeaders: ["*"]
            ExposedHeaders: [ETag]
            MaxAge: 3600
      LifecycleConfiguration:
        Rules:
          - Id: abort-incomplete
            Status: Enabled
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 }

  PhotoBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PhotoBucket
      PolicyDocument:
        Statement:
          - Sid: HttpsOnly
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt PhotoBucket.Arn
              - !Sub ${PhotoBucket.Arn}/*
            Condition: { Bool: { aws:SecureTransport: "false" } }

  # ─── Auth: Cognito (admin-created users, password sign-in from the SPA) ─
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub ${AWS::StackName}-${Stage}-users
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      MfaConfiguration: "OFF"
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true   # no public sign-up; admins invite from Settings → People
        # Cognito requires both {username} and {####} (the temporary password) in this message.
        InviteMessageTemplate:
          EmailSubject: You're invited to Trading Journal
          EmailMessage: !Sub >-
            You've been invited to Trading Journal.<br><br>
            Open ${AppUrl} and sign in with:<br>
            Email: {username}<br>
            Temporary password: {####}<br><br>
            You'll choose your own password the first time you sign in. The temporary password expires in 7 days.
      Schema:
        - { Name: email, Required: true, Mutable: true }
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
      AccountRecoverySetting:
        RecoveryMechanisms: [{ Name: verified_email, Priority: 1 }]

  # Members manage people in-app (Settings → People) via AdminFunction. Seed the first one with scripts/make-admin.sh.
  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admin
      Description: Can invite, disable and remove users in the app
      UserPoolId: !Ref UserPool

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub ${AWS::StackName}-${Stage}-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false   # public SPA client
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 365   # one sign-in per device
      TokenValidityUnits: { AccessToken: minutes, IdToken: minutes, RefreshToken: days }

  # ─── API ───────────────────────────────────────────────────────────────
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-${Stage}-api
      RetentionInDays: 30

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-${Stage}-api
      CodeUri: backend/functions/api/
      Handler: app.lambda_handler
      LoggingConfig:
        LogGroup: !Ref ApiLogGroup
      Environment:
        Variables:
          TABLE_NAME: !Ref JournalTable
          PHOTO_BUCKET: !Ref PhotoBucket
          COACH_MODEL_ID: !Ref CoachModelId
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref JournalTable }
        - Statement:
            - Effect: Allow
              Action: [s3:PutObject, s3:GetObject, s3:DeleteObject]
              Resource: !Sub ${PhotoBucket.Arn}/users/*
            # Converse is authorized by bedrock:InvokeModel (there is no separate bedrock:Converse action).
            # Foundation-model ARN is region-wildcarded so a cross-region inference profile can route.
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/${CoachModelId}
                - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${CoachModelId}
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/health
            Method: GET
            Auth: { Authorizer: NONE }
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/{proxy+}
            Method: ANY

  # Market context (docs/market-context.md). Shared, non-user data behind the same JWT authorizer.
  # These routes are more specific than ApiFunction's ANY /api/{proxy+}, so HTTP API routes them here.
  MarketLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-${Stage}-market
      RetentionInDays: 30

  MarketFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-${Stage}-market
      CodeUri: backend/functions/market/
      Handler: app.lambda_handler
      Timeout: 20
      MemorySize: 512
      LoggingConfig:
        LogGroup: !Ref MarketLogGroup
      Environment:
        Variables:
          TABLE_NAME: !Ref JournalTable
          FMP_KEY_PARAM: !Ref FmpKeyParam
          POWERTOOLS_SERVICE_NAME: tradejournal-market
      Policies:
        # Market data is shared cache only: scoped to items whose partition key is MARKET, so this
        # function can never read or write any user's journal rows (pk USER#<sub>).
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem]
              Resource: !GetAtt JournalTable.Arn
              Condition:
                ForAllValues:StringEquals:
                  dynamodb:LeadingKeys: [MARKET]
        # SecureString under the AWS managed aws/ssm key: no kms:Decrypt needed (its key policy allows
        # in-account callers via SSM). A customer-managed CMK would need kms:Decrypt here and in the boundary.
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${FmpKeyParam}
      Events:
        MarketDay:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/market/day/{date}
            Method: GET
        MarketBars:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/market/bars
            Method: GET

  # In-app user management (Settings → People). Its own function so only this role holds Cognito admin rights;
  # the handler also requires `admin` in the caller's cognito:groups claim. More specific than /api/{proxy+}.
  AdminLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-${Stage}-admin
      RetentionInDays: 30

  AdminFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-${Stage}-admin
      CodeUri: backend/functions/admin/
      Handler: app.lambda_handler
      MemorySize: 256
      LoggingConfig:
        LogGroup: !Ref AdminLogGroup
      Environment:
        Variables:
          USER_POOL_ID: !Ref UserPool
          TABLE_NAME: !Ref JournalTable
          PHOTO_BUCKET: !Ref PhotoBucket
          POWERTOOLS_SERVICE_NAME: tradejournal-admin
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:ListUsers
                - cognito-idp:ListUsersInGroup
                - cognito-idp:AdminGetUser
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminDeleteUser
                - cognito-idp:AdminDisableUser
                - cognito-idp:AdminEnableUser
                - cognito-idp:AdminSetUserPassword
                - cognito-idp:AdminUserGlobalSignOut
                - cognito-idp:AdminAddUserToGroup
                - cognito-idp:AdminRemoveUserFromGroup
              Resource: !GetAtt UserPool.Arn
            # Purge: Query the target's USER#<sub> partition, then batch-delete it.
            - Effect: Allow
              Action: [dynamodb:Query, dynamodb:BatchWriteItem, dynamodb:DeleteItem]
              Resource: !GetAtt JournalTable.Arn
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt PhotoBucket.Arn
              Condition:
                StringLike:
                  s3:prefix: [users/*]
            - Effect: Allow
              Action: s3:DeleteObject
              Resource: !Sub ${PhotoBucket.Arn}/users/*
      Events:
        ListUsers:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/admin/users
            Method: GET
        InviteUser:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/admin/users
            Method: POST
        UserAction:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/admin/users/{username}/{action}
            Method: POST
        DeleteUser:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/admin/users/{username}
            Method: DELETE

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 25
      AccessLogSettings:
        DestinationArn: !GetAtt HttpApiLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","method":"$context.httpMethod","path":"$context.path","status":"$context.status","latency":"$context.responseLatency","authError":"$context.authorizer.error","userAgent":"$context.identity.userAgent"}'
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            # The SPA sends the Cognito ACCESS token; HTTP API checks its client_id against audience.
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience:
                - !Ref UserPoolClient

  HttpApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/http-api/${AWS::StackName}-${Stage}
      RetentionInDays: 30

  # ─── Web: S3 + CloudFront (one origin: SPA + /api) ────────────────────
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      # Auto-named (stack-name prefix).
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Statement:
          - Sid: HttpsOnly
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt WebBucket.Arn
              - !Sub ${WebBucket.Arn}/*
            Condition: { Bool: { aws:SecureTransport: "false" } }
          - Sid: CloudFrontOriginOnly
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub ${WebBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}

  WebOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-${Stage}-web-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Client-side routes (/calendar, /trades) → /index.html. Attached only to the S3 default behavior, so
  # /api errors are never masked; the /api/ guard is belt-and-braces.
  SpaRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub ${AWS::StackName}-${Stage}-spa-rewrite
      AutoPublish: true
      FunctionConfig:
        Comment: Rewrite extensionless non-API paths to /index.html
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var req = event.request;
          if (req.uri.indexOf('/api/') === 0) { return req; }
          var last = req.uri.split('/').pop();
          if (last.indexOf('.') === -1) { req.uri = '/index.html'; }
          return req;
        }

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub ${AWS::StackName}-${Stage}-security-headers
        SecurityHeadersConfig:
          StrictTransportSecurity: { AccessControlMaxAgeSec: 63072000, IncludeSubdomains: true, Preload: true, Override: true }
          ContentTypeOptions: { Override: true }
          FrameOptions: { FrameOption: DENY, Override: true }
          ReferrerPolicy: { ReferrerPolicy: strict-origin-when-cross-origin, Override: true }
          ContentSecurityPolicy:
            Override: true
            # Cognito is called directly from the SPA (fetch); photos are presigned URLs on the
            # bucket's regional domain (the API signs against that exact host).
            ContentSecurityPolicy: !Sub >-
              default-src 'self';
              script-src 'self';
              style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
              font-src 'self' https://fonts.gstatic.com;
              img-src 'self' data: blob: https://${PhotoBucket.RegionalDomainName};
              connect-src 'self' https://cognito-idp.${AWS::Region}.amazonaws.com https://${PhotoBucket.RegionalDomainName};
              manifest-src 'self';
              worker-src 'self';
              object-src 'none';
              base-uri 'self';
              form-action 'self';
              frame-ancestors 'none'
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: "camera=(), microphone=(), geolocation=()"
              Override: true

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      # Ownership tag: the CI deploy role may only update/delete/untag distributions carrying it
      # (the account hosts other sites' distributions). Never remove or change it.
      Tags:
        - Key: tradejournal:managed-by
          Value: tradejournal-cicd
      DistributionConfig:
        Comment: !Sub ${AWS::StackName}-${Stage}
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !Ref WebOAC
            S3OriginConfig: { OriginAccessIdentity: "" }
          - Id: api
            DomainName: !Sub ${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6          # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewriteFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          # Same origin → no CORS. Caching disabled, so AllViewerExceptHostHeader forwards the
          # Authorization header (Host must be the execute-api host, hence "ExceptHost").
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad          # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # Managed-AllViewerExceptHostHeader
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          # Runtime config (pool/client ids) must never be stale at the edge: never cached by CloudFront
          # (the deploy also uploads it with Cache-Control: no-cache for browsers).
          - PathPattern: /config.json
            TargetOriginId: web
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad          # Managed-CachingDisabled
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy

Outputs:
  AppUrl:
    Description: Public app URL
    Value: !Sub https://${CloudFrontDistribution.DomainName}
  DistributionId:
    Value: !Ref CloudFrontDistribution
  WebBucketName:
    Value: !Ref WebBucket
  PhotoBucketName:
    Value: !Ref PhotoBucket
  TableName:
    Value: !Ref JournalTable
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  Region:
    Value: !Ref AWS::Region
