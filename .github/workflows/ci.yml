# CI — the ONE required status check is `ci-ok` (an if: always() aggregator), because requiring
# skippable jobs directly is brittle (a renamed job leaves the check "expected" forever).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Supersede runs on the same PR, but never cancel a main run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no floating major tag, so it is pinned to an exact release.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
      - name: Install (locked; ruff pinned in pyproject so CI never drifts from local)
        run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
      - name: sam validate --lint
        run: sam validate --lint --region us-east-1

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The single required check for branch protection.
  ci-ok:
    needs: [backend, frontend]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail if any dependency failed or was cancelled
        run: |
          echo '${{ toJSON(needs) }}'
          [ "${{ contains(join(needs.*.result, ','), 'failure') }}" = "false" ] \
            && [ "${{ contains(join(needs.*.result, ','), 'cancelled') }}" = "false" ]
